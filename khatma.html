  <body class="ix app">
    <header class="app-bar">
      <div class="in">
        <a class="ab" href="./index.html" data-ix-back aria-label="رجوع"><i class="bi bi-chevron-right"></i></a>
        <a class="logo" href="./index.html" aria-label="إشراق"><img src="./5b862b4281f64fd884b11984846f0e97.png" alt="إشراق" /></a>
        <button class="ab" type="button" data-ix-more aria-label="المزيد"><i class="bi bi-grid-fill"></i></button>
      </div>
    </header>
    <div class="ix-wrap"><section class="ix-qhead"><div class="ix-hello">SMART KHATMA</div><h1 class="ix-tag">الختمة <span class="ol">الذكية</span></h1></section></div>

    <main class="pb-5"><div class="ix-wrap fx">

<div id="kh-setup" class="fx-card">
  <h3>ابدأ خطة ختمتك</h3>
  <p class="fx-m">اختر عدد الأيام وسنوزّع الصفحات عليك يومياً، وإذا فاتك يوم نعيد توزيع الباقي تلقائياً.</p>
  <label class="fx-lb">مدة الختمة</label>
  <div class="fx-tabs" id="kh-opts"></div>
  <label class="fx-lb">أو عدد أيام مخصص</label>
  <input id="kh-custom" class="fx-in" type="number" min="3" max="365" placeholder="مثلاً 40" />
  <button id="kh-start" class="fx-btn w" style="margin-top:14px"><i class="bi bi-flag-fill"></i> ابدأ الخطة</button>
</div>
<div id="kh-dash" style="display:none">
  <div class="fx-card fx-hero"><small>وردك اليوم</small><div class="fx-big" id="kh-today"></div><small id="kh-today-sub"></small>
    <button id="kh-done" class="fx-btn w" style="margin-top:14px"><i class="bi bi-check2-circle"></i> أتممت وردي اليوم</button>
    <a href="./quran.html" class="fx-btn o w" style="margin-top:8px"><i class="bi bi-book"></i> افتح المصحف</a></div>
  <div class="fx-card"><h3>تقدّمك</h3><div class="fx-bar"><i id="kh-bar"></i></div>
    <div class="fx-two" style="margin-top:12px"><div class="fx-stat"><b id="kh-pg">0</b><span>صفحة مقروءة من 604</span></div><div class="fx-stat"><b id="kh-left">0</b><span>يوم متبقٍّ</span></div></div>
    <p class="fx-m" id="kh-note" style="margin:12px 0 0"></p></div>
  <div class="fx-card"><h3>سجّل موضع وصولك</h3><div class="fx-row"><input id="kh-set" class="fx-in" type="number" min="0" max="604" placeholder="رقم الصفحة التي وصلت إليها" /><button id="kh-setb" class="fx-btn o" style="flex:none">حفظ</button></div></div>
  <button id="kh-reset" class="fx-btn o w">إلغاء الخطة وبدء خطة جديدة</button>
</div>
    </div></main>

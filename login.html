
<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0c">

  <title>الإشراق | تسجيل الدخول</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <style>
*{box-sizing:border-box}
:root{--k:#0b0b0c;--c1:#131315;--c2:#1b1c1f;--c3:#2a2c30;--t:#ececec;--m:#8f9197;--a:#d6ac52;--a2:#edcea0}
body{margin:0;min-height:100vh;font-family:Cairo,Tajawal,system-ui,sans-serif;color:var(--t);line-height:1.8;background:var(--k);
 background-image:radial-gradient(900px 420px at 85% -80px,#d6ac5220,transparent 70%),radial-gradient(700px 380px at 5% 60%,#d6ac520e,transparent 70%);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Reem Kufi",Cairo,sans-serif}
.notch{border-radius:22px}

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px 16px;position:relative;z-index:1}
.login-wrapper{width:100%;max-width:420px}
.brand-area{text-align:center;margin-bottom:26px}
.brand-symbol{width:92px;height:92px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;position:relative}
.brand-symbol::before{content:"";position:absolute;inset:0;border:1px dashed #d6ac5266;border-radius:50%;animation:spin 40s linear infinite}
.brand-symbol img{width:70px;height:70px;object-fit:contain}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-name{font-family:"Reem Kufi",Cairo,sans-serif;font-size:3.1rem;line-height:1.2;margin:0;color:var(--a2);letter-spacing:.02em}
.brand-subtitle{color:var(--m);margin:6px 0 0;font-size:.95rem}
.gold-divider{width:110px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--a),transparent)}
.login-card{position:relative;overflow:hidden;padding:30px 24px 26px;background:linear-gradient(180deg,var(--c2),var(--c1));
 border-radius:22px}
.login-card::before{content:"";position:absolute;inset:0;border:1px solid var(--c3);pointer-events:none;border-radius:22px}
.login-card::after{content:"";position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent)}
.card-heading{text-align:center;margin-bottom:24px}
.card-heading h1{font-size:1.4rem;font-weight:700;margin-bottom:6px}
.card-heading p{color:var(--m);font-size:.88rem;margin:0}
.form-label{color:#c9c9cd;font-size:.88rem;margin-bottom:6px}
.input-wrapper{position:relative}
.input-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--a);pointer-events:none}
.ishraq-input{width:100%;min-height:52px;padding:10px 44px;border:1px solid var(--c3);border-radius:0;color:#fff;background:var(--k);font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.ishraq-input::placeholder{color:#5f6167}
.ishraq-input:focus{border-color:var(--a);box-shadow:0 0 0 3px #d6ac5218}
.password-toggle{position:absolute;left:13px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--m);cursor:pointer}
.password-toggle:hover{color:var(--a2)}
.login-button{width:100%;min-height:54px;margin-top:24px;border:0;border-radius:0;color:#1c1405;background:linear-gradient(135deg,#edcea0,#d6ac52);font-family:inherit;font-size:1rem;font-weight:800;transition:transform .2s,filter .2s;
 border-radius:22px}
.login-button:hover{filter:brightness(1.07)}
.login-button:active{transform:scale(.98)}
.login-button:disabled{opacity:.7;cursor:wait}
.login-error{display:none;margin-top:16px;padding:12px;border:1px solid #e0606055;border-right:3px solid #e06060;background:#7f1d1d33;color:#f3b9b9;font-size:.87rem;line-height:1.6}
.login-error.show{display:block}
.login-footer{background:transparent!important;border:0!important;padding:0!important;margin-top:24px;text-align:center;color:var(--m);font-size:.8rem;line-height:1.9}
.login-footer strong{color:var(--a);font-weight:700}
@media(max-width:480px){.brand-name{font-size:2.8rem}.login-card{padding:26px 18px 22px}}
@media(prefers-reduced-motion:reduce){.brand-symbol::before{animation:none}}
  input,select,button,.btn{border-radius:14px!important}
.lg-tabs{display:flex;gap:6px;padding:4px;margin-bottom:22px;background:var(--k);border:1px solid var(--c3);border-radius:16px!important}
.lg-tabs button{flex:1;border:0;background:transparent;color:var(--m);padding:9px;font:700 .92rem Cairo,sans-serif;border-radius:12px!important}
.lg-tabs button.on{background:linear-gradient(135deg,#edcea0,#d6ac52);color:#1c1405}
.lg-or{display:flex;align-items:center;gap:10px;margin:20px 0 14px;color:var(--m);font-size:.8rem}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--c3)}
.google-button{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--c3);background:var(--k);color:var(--t);font:700 .95rem Cairo,sans-serif;border-radius:18px!important}
.google-button:hover{border-color:var(--a)}
.google-button:disabled{opacity:.6;cursor:wait}
.mb-reg{display:none}.reg .mb-reg{display:block}.reg .only-login{display:none}
</style>
    <link rel="stylesheet" href="./ishraq-light.css" />
    <script src="./ishraq-theme.js"></script>
  </head>

<body>
  <main class="login-page">
    <div class="login-wrapper">

      <header class="brand-area">
        <div class="brand-symbol">
          <img
            src="./5b862b4281f64fd884b11984846f0e97.png"
            alt="شعار الإشراق"
          >
        </div>

        <h2 class="brand-name">الإشراق</h2>
        <p class="brand-subtitle">نشرق بروحك ونسمو بقلبك</p>
        <div class="gold-divider"></div>
      </header>

      <section class="login-card">
        <div class="lg-tabs" role="tablist">
          <button type="button" id="tabLogin" class="on">تسجيل الدخول</button>
          <button type="button" id="tabReg">حساب جديد</button>
        </div>
        <div class="card-heading">
          <h1 id="lgTitle">أهلًا بك في الإشراق</h1>
          <p id="lgSub">سجّل دخولك وتابع رحلتك الإيمانية</p>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <div class="input-wrapper">
              <i class="bi bi-envelope input-icon"></i>
              <input
                type="email"
                id="email"
                class="ishraq-input"
                placeholder="أدخل بريدك الإلكتروني"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div>
            <label for="password" class="form-label">كلمة المرور</label>
            <div class="input-wrapper">
              <i class="bi bi-lock input-icon"></i>
              <input
                type="password"
                id="password"
                class="ishraq-input"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="إظهار كلمة المرور"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-reg mt-3">
            <label for="password2" class="form-label">تأكيد كلمة المرور</label>
            <div class="input-wrapper">
              <i class="bi bi-shield-lock input-icon"></i>
              <input type="password" id="password2" class="ishraq-input" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password">
            </div>
          </div>

          <div id="loginError" class="login-error" role="alert"></div>

          <button type="submit" id="loginButton" class="login-button">
            <i class="bi bi-box-arrow-in-left ms-1"></i>
            تسجيل الدخول
          </button>
        </form>

        <div class="lg-or"><span>أو</span></div>
        <button type="button" id="googleButton" class="google-button">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          <span id="googleLabel">المتابعة بحساب غوغل</span>
        </button>
      </section>

      <footer class="login-footer">
        <div><strong>الإشراق</strong> — نشرق بروحك ونسمو بقلبك</div>
        <div>نسأل الله أن يجعل هذا العمل نورًا وأجرًا ممتدًا</div>
      </footer>

    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3RQ2jrXcJOUqmhUrGuBQ6R8kZ2sSLOr0",
      authDomain: "alishraq-fe305.firebaseapp.com",
      projectId: "alishraq-fe305",
      storageBucket: "alishraq-fe305.firebasestorage.app",
      messagingSenderId: "816905605188",
      appId: "1:816905605188:web:639252ce9ef899bd622c11",
      measurementId: "G-X6NV8MT549"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const errorBox = document.getElementById("loginError");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      togglePassword.innerHTML = show
        ? '<i class="bi bi-eye-slash"></i>'
        : '<i class="bi bi-eye"></i>';
      togglePassword.setAttribute(
        "aria-label",
        show ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"
      );
    });

    const card = document.querySelector(".login-card");
    const pass2 = document.getElementById("password2");
    let reg = false;
    const setMode = (r) => {
      reg = r;
      card.classList.toggle("reg", r);
      document.getElementById("tabLogin").classList.toggle("on", !r);
      document.getElementById("tabReg").classList.toggle("on", r);
      document.getElementById("lgTitle").textContent = r ? "انضم إلى الإشراق" : "أهلًا بك في الإشراق";
      document.getElementById("lgSub").textContent = r ? "أنشئ حسابك وابدأ رحلتك الإيمانية" : "سجّل دخولك وتابع رحلتك الإيمانية";
      button.innerHTML = r ? '<i class="bi bi-person-plus ms-1"></i> إنشاء الحساب' : '<i class="bi bi-box-arrow-in-left ms-1"></i> تسجيل الدخول';
      passwordInput.autocomplete = r ? "new-password" : "current-password";
      pass2.required = r;
      errorBox.classList.remove("show");
    };
    document.getElementById("tabLogin").onclick = () => setMode(false);
    document.getElementById("tabReg").onclick = () => setMode(true);
    if (location.hash === "#register") setMode(true);

    const MSG = {
      "auth/invalid-credential": "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
      "auth/invalid-email": "يرجى إدخال بريد إلكتروني صحيح.",
      "auth/user-disabled": "هذا الحساب معطّل.",
      "auth/too-many-requests": "محاولات كثيرة. حاول مرة أخرى بعد قليل.",
      "auth/network-request-failed": "تعذّر الاتصال بالإنترنت. تحقق من اتصالك.",
      "auth/email-already-in-use": "هذا البريد مسجّل مسبقًا، جرّب تسجيل الدخول.",
      "auth/weak-password": "كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل.",
      "auth/popup-closed-by-user": "أُغلقت نافذة غوغل قبل إكمال التسجيل.",
      "auth/cancelled-popup-request": "أُغلقت نافذة غوغل قبل إكمال التسجيل.",
      "auth/account-exists-with-different-credential": "هذا البريد مسجّل بطريقة أخرى، سجّل الدخول بها.",
      "auth/unauthorized-domain": "هذا النطاق غير مصرّح له في إعدادات Firebase.",
      "auth/operation-not-allowed": "هذه الطريقة غير مفعّلة بعد في إعدادات Firebase."
    };
    const fail = (e) => { console.error("Auth error:", e); errorBox.textContent = MSG[e.code] || "تعذّرت العملية. حاول مرة أخرى."; errorBox.classList.add("show"); };

    const gBtn = document.getElementById("googleButton");
    gBtn.addEventListener("click", async () => {
      errorBox.classList.remove("show"); gBtn.disabled = true;
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      try {
        await signInWithPopup(auth, provider);
        window.location.replace("./index.html");
      } catch (e) {
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
          try { await signInWithRedirect(auth, provider); return; } catch (e2) { fail(e2); }
        } else fail(e);
        gBtn.disabled = false;
      }
    });
    getRedirectResult(auth).then((r) => { if (r && r.user) window.location.replace("./index.html"); }).catch(fail);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.classList.remove("show");
      if (reg) {
        if (passwordInput.value.length < 6) return fail({ code: "auth/weak-password" });
        if (passwordInput.value !== pass2.value) { errorBox.textContent = "كلمتا المرور غير متطابقتين."; errorBox.classList.add("show"); return; }
      }

      const originalButton = button.innerHTML;
      button.disabled = true;
      button.innerHTML =
        '<span class="spinner-border spinner-border-sm ms-2"></span> جارٍ المعالجة...';

      try {
        if (reg) {
          const cr = await createUserWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
          try { await sendEmailVerification(cr.user); } catch (e) {}
        } else {
          await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        }

        window.location.replace("./index.html");
      } catch (error) {
        console.error("Login error:", error);

        fail(error);
        button.disabled = false;
        button.innerHTML = originalButton;
      }
    });
  </script>
</body>
</html>
